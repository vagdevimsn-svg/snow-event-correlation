[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snow-event-correlation"
version = "1.1.0"
description = "Event Management-style alert correlation to ServiceNow incidents: de-dup, CI binding, suppression, flap detection"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Vagdevi Meka" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["servicenow", "event-management", "aiops", "itom", "cmdb"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
event-corr = "event_corr.__main__:main"
event-corr-serve = "event_corr.server:main"

[tool.setuptools]
packages = ["event_corr"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
