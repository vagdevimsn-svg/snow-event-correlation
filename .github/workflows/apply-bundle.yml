name: Apply bundled update
on:
  push:
    paths: [".github/patch/update.b64"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack bundle and commit
        run: |
          base64 -d .github/patch/update.b64 | tar -xz
          git rm -q .github/patch/update.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply v1.1 bundle: sample data, docs, packaging, README"
          git push
